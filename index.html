<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>진선 님 채용공고 브리핑</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
/* Layout: 한 장의 통근 지도 위에 오늘 공고를 번호로 찍고, 아래에 공고별 카드(통근 띠 + 기업분석)를 쌓는다 */
:root{
  --bg:#f4f6f8; --surface:#ffffff; --ink:#15202b; --muted:#5b6876; --line:#d9e0e7;
  --line1:#0052a4;           /* 수도권 전철 1호선 색 */
  --steel:#c4511d;           /* 찬규 직장(제철소) */
  --home:#2f7d4f;            /* 집 후보 */
  --job:#15202b;
  --hi:#1f6f43; --mid:#8a6a12; --hi-bg:#e3f2e8; --mid-bg:#f6eed6;
  --river:#cfe0ee; --grid:#e8edf2; --bad:#b3261e; --bad-bg:#fbe4e2;
  --f-body:"IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0f1418; --surface:#172027; --ink:#e7edf2; --muted:#9aa8b5; --line:#2a3741;
  --line1:#5b9be0; --steel:#ef8a55; --home:#5fc28a; --job:#e7edf2;
  --hi:#7fd6a1; --mid:#e3c46b; --hi-bg:#17352a; --mid-bg:#3a3117;
  --river:#1d3346; --grid:#1c262e; --bad:#f2958c; --bad-bg:#3d1e1c; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0f1418; --surface:#172027; --ink:#e7edf2; --muted:#9aa8b5; --line:#2a3741;
  --line1:#5b9be0; --steel:#ef8a55; --home:#5fc28a; --job:#e7edf2;
  --hi:#7fd6a1; --mid:#e3c46b; --hi-bg:#17352a; --mid-bg:#3a3117;
  --river:#1d3346; --grid:#1c262e; --bad:#f2958c; --bad-bg:#3d1e1c; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.6;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:28px 56px}
.wrap{max-width:1440px;margin:0 auto;display:flex;flex-direction:column;gap:28px}
h1{font-size:1.6rem;margin:0;text-wrap:balance;letter-spacing:-.01em}
h2{font-size:1.15rem;margin:0;text-wrap:balance}
h3{font-size:.8rem;margin:0;color:var(--muted);letter-spacing:.06em;font-weight:600}
p{margin:0}
a{color:var(--line1)}
a:focus-visible,button:focus-visible{outline:2px solid var(--line1);outline-offset:2px}
.sub{color:var(--muted);font-size:.9rem}
header{display:flex;flex-direction:column;gap:6px}
.basis{display:flex;flex-wrap:wrap;gap:8px 16px;font-size:.85rem;color:var(--muted)}
.dot{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:6px;vertical-align:-1px}
.mapbox{background:var(--surface);border:1px solid var(--line);border-radius:10px;overflow:hidden}
.mapbox .cap{padding:12px 16px;border-top:1px solid var(--line);font-size:.82rem;color:var(--muted)}
.mapscroll{overflow-x:auto;border:1px solid var(--line);border-radius:8px;max-width:520px}
.mapcommute{display:grid;grid-template-columns:minmax(0,520px) minmax(0,1fr);gap:14px;align-items:start}
@media (max-width:820px){.mapcommute{grid-template-columns:1fr}}
.mapcommute .commute{grid-template-columns:1fr}
.sect{display:flex;flex-direction:column;gap:8px}
.chk{width:100%;border-collapse:collapse;font-size:.9rem}
.chk td{padding:7px 8px;border-top:1px solid var(--line);vertical-align:top}
.chk td:first-child{width:96px;white-space:nowrap}
.chk .note{color:var(--muted);font-size:.85rem}
.tag{display:inline-block;font-size:.72rem;font-weight:600;padding:2px 8px;border-radius:999px;white-space:nowrap}
.tag.good{background:var(--hi-bg);color:var(--hi)}
.tag.mid{background:var(--mid-bg);color:var(--mid)}
.tag.bad{background:var(--bad-bg);color:var(--bad)}
.tag.unk{background:var(--bg);color:var(--muted);border:1px solid var(--line)}
.newb{display:inline-block;font-size:.68rem;font-weight:700;letter-spacing:.06em;padding:1px 7px;border-radius:4px;background:var(--steel);color:var(--surface);vertical-align:2px;margin-left:6px}
.filters{display:flex;gap:8px}
.filters button{font:inherit;font-size:.85rem;padding:5px 12px;border-radius:999px;border:1px solid var(--line);background:var(--surface);color:var(--ink);cursor:pointer}
.filters button[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.evals{display:flex;flex-wrap:wrap;gap:4px}
.evalgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px}
.evalgrid div{border:1px solid var(--line);border-radius:8px;padding:10px 12px;display:flex;flex-direction:column;gap:4px}
tr.isnew td:first-child{box-shadow:inset 3px 0 0 var(--steel)}
.tablewrap{overflow-x:auto;background:var(--surface);border:1px solid var(--line);border-radius:10px}
.overview{width:100%;border-collapse:collapse;font-size:.86rem;min-width:1180px}
.overview .evals{display:flex;flex-wrap:wrap;gap:4px;min-width:150px}
.overview th{text-align:left;font-size:.75rem;color:var(--muted);font-weight:600;padding:10px 8px;border-bottom:1px solid var(--line);white-space:nowrap}
.overview td{padding:10px 8px;border-top:1px solid var(--line);vertical-align:top}
.overview tr.row{cursor:pointer}
.overview tr.row:hover td{background:var(--bg)}
.overview .co{font-weight:600}
.overview .num2{font-family:var(--f-mono);font-variant-numeric:tabular-nums;white-space:nowrap}
details.card>summary{list-style:none;cursor:default}
details.card>summary::-webkit-details-marker{display:none}
details.card[open]>summary{margin-bottom:4px}
.chev{margin-left:auto;flex:none;color:var(--muted);font-size:.8rem;white-space:nowrap}
details.card[open] .chev .o{display:none} details.card:not([open]) .chev .c{display:none}
.certs summary{cursor:pointer;font-size:.88rem;color:var(--line1)}
.certs .chk{max-width:640px;margin-top:6px}
.salary{display:flex;flex-direction:column;gap:4px;border:1px solid var(--line);border-radius:8px;padding:12px 14px}
.salary .min{font-family:var(--f-mono);font-size:1.25rem}
.expline{background:var(--bg);border-radius:8px;padding:10px 14px;font-size:.92rem}
.gap{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:20px;display:flex;flex-direction:column;gap:18px}
.gapitem{display:flex;flex-direction:column;gap:6px;padding-top:14px;border-top:1px solid var(--line)}
.gapitem ul,.recs{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:4px}
.gapitem .seen{font-size:.88rem;color:var(--muted)}
.when{font-size:.75rem;font-weight:600;color:var(--line1)}
svg.map{display:block;width:100%;height:auto}
.daytabs{display:flex;flex-wrap:wrap;gap:8px}
.daytabs button{font:inherit;font-size:.85rem;padding:6px 12px;border-radius:999px;border:1px solid var(--line);background:var(--surface);color:var(--ink);cursor:pointer}
.daytabs button[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.summary{display:flex;flex-direction:column;gap:10px}
.jobs{display:flex;flex-direction:column;gap:18px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:20px;display:flex;flex-direction:column;gap:16px;scroll-margin-top:16px}
.card.sel{border-color:var(--line1);box-shadow:0 0 0 1px var(--line1)}
.top{display:flex;gap:14px;align-items:flex-start}
.num{flex:none;width:30px;height:30px;border-radius:50%;background:var(--job);color:var(--bg);display:grid;place-items:center;font-family:var(--f-mono);font-size:.9rem}
.top .t{min-width:0;display:flex;flex-direction:column;gap:4px}
.meta{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:.85rem;color:var(--muted)}
.pill{display:inline-block;font-size:.75rem;font-weight:600;padding:2px 9px;border-radius:999px}
.pill.상{background:var(--hi-bg);color:var(--hi)} .pill.중{background:var(--mid-bg);color:var(--mid)}
.finbox{border:1px solid var(--line);border-radius:8px;padding:12px 14px;display:grid;grid-template-columns:minmax(0,420px) minmax(0,560px);gap:24px;align-items:start}
@media (max-width:820px){.finbox{grid-template-columns:1fr}}
.finbox svg{width:100%;height:auto;display:block}
.finbox .bar{fill:var(--line1)}.finbox .bar.neg{fill:var(--bad)}
.finbox text{font-family:var(--f-mono);font-size:11px;fill:var(--ink)}
.finbox text.yr{fill:var(--muted)}
.due{font-weight:600;color:var(--steel)}
.due.soon{color:var(--bad)}
.dday{display:inline-block;margin-left:6px;padding:1px 7px;border-radius:999px;background:var(--bad);color:#fff;font-size:.72rem;font-weight:700;font-family:var(--f-mono);vertical-align:1px}
tr.row.soonrow td.due{background:var(--bad-bg)}
.dday.calm{background:var(--line);color:var(--ink)}
.commute{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:12px}
.leg{border:1px solid var(--line);border-radius:8px;padding:12px 14px;display:flex;flex-direction:column;gap:6px;min-width:0}
.leg .who{font-size:.78rem;color:var(--muted);letter-spacing:.04em;font-weight:600}
.leg .min{font-family:var(--f-mono);font-size:1.35rem;font-variant-numeric:tabular-nums}
.leg .min small{font-family:var(--f-body);font-size:.8rem;color:var(--muted);margin-left:4px}
.strip{display:flex;align-items:center;gap:6px;font-size:.8rem;flex-wrap:wrap}
.strip .seg{height:6px;border-radius:3px;flex:1 1 40px;min-width:24px}
.strip .lbl{white-space:nowrap}
.analysis{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:14px 24px}
.analysis div{display:flex;flex-direction:column;gap:4px;min-width:0}
.analysis p{font-size:.92rem}
.fitbox{background:var(--bg);border-radius:8px;padding:12px 14px;display:flex;flex-direction:column;gap:4px}
.links{display:flex;flex-wrap:wrap;gap:8px 16px;font-size:.85rem}
.homes{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.homes .lab{font-size:.8rem;color:var(--muted);font-weight:600;margin-right:4px}
.homes button{font:inherit;font-size:.85rem;padding:5px 12px;border-radius:999px;border:1px solid var(--line);background:var(--surface);color:var(--ink);cursor:pointer}
.homes button[aria-pressed="true"]{background:var(--home);border-color:var(--home);color:var(--surface)}
.homes button .rec{font-size:.72rem;margin-left:4px;opacity:.85}
.homewhy{font-size:.88rem;color:var(--muted)}
.others{font-size:.85rem;color:var(--muted)}
.empty{color:var(--muted)}
footer{font-size:.8rem;color:var(--muted)}
details.card.impcard{background:#fff7dc;border:2px solid #e0a100;box-shadow:0 0 0 4px rgba(224,161,0,.12)}
.impb{display:inline-block;margin-left:8px;padding:2px 10px;border-radius:999px;background:#e0a100;color:#fff;font-size:.75rem;font-weight:700;vertical-align:3px}
.overview tr.imprw td{background:#fff7dc}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) details.card.impcard{background:#2e2610}:root:not([data-theme="light"]) .overview tr.imprw td{background:#2e2610}}
:root[data-theme="dark"] details.card.impcard{background:#2e2610}
:root[data-theme="dark"] .overview tr.imprw td{background:#2e2610}

.stars{display:flex;gap:1px;white-space:nowrap}
.stars button{font:inherit;font-size:.95rem;line-height:1;padding:2px 1px;background:none;border:0;color:var(--line);cursor:pointer}
.stars button.on{color:#e0a100}
.stars button:disabled{cursor:default}
.stars button:not(:disabled):hover{transform:scale(1.15)}
.improw{display:flex;align-items:center;gap:4px;white-space:nowrap}
.improw .who{font-size:.72rem;color:var(--muted);width:2.4em}
.stars.mine button:not(:disabled){color:var(--line)}
.stars.mine button.on{color:#e0a100}

.fitbox strong{display:inline-block;font-size:.75rem;padding:1px 8px;border-radius:999px;margin-right:6px}
.fitok{background:var(--hi-bg);color:var(--hi)}
.fitno{background:var(--bad-bg);color:var(--bad)}
.cbox{border:1px solid var(--line);border-radius:8px;display:flex;flex-direction:column}
.crow{display:grid;grid-template-columns:76px 92px minmax(0,1fr);gap:10px;align-items:center;padding:8px 12px;border-top:1px solid var(--line)}
.crow:first-child{border-top:0}
.crow .who{font-size:.78rem;color:var(--muted);font-weight:600}
.crow .min{font-family:var(--f-mono);font-size:1rem;font-variant-numeric:tabular-nums;white-space:nowrap}
.crow .min small{font-family:var(--f-body);font-size:.72rem;color:var(--muted);margin-left:4px}
.crow .cdet{display:flex;flex-direction:column;gap:4px;min-width:0}
.crow .cdet .sub{font-size:.8rem}
.maplegend{margin-top:6px;font-size:.78rem}
.commutesect{border-top:1px dashed var(--line);padding-top:12px}
#tip{position:fixed;z-index:50;max-width:380px;pointer-events:none;background:var(--ink);color:var(--surface);font-size:.8rem;line-height:1.5;padding:8px 10px;border-radius:6px;white-space:pre-line;box-shadow:0 4px 14px rgba(0,0,0,.18);display:none}
.overview td[data-tip]{cursor:help}

</style>
</head>
<body>

<div class="wrap">
  <header>
    <h1>진선 님 채용공고 브리핑</h1>
    <p class="sub" id="asof"></p>
    <p class="sub" id="profile"></p>
    <details class="certs"><summary>내 자격증 보기</summary><table class="chk" id="certs"></table></details>
  </header>


  <p class="sub">통근은 집 미정 기준으로, 회사마다 두 사람 모두 편한 동네를 추천합니다(환승 없이 한 번에, 편도 90분 이내). 각 카드 맨 아래에서 동네를 바꿔 볼 수 있어요.</p>


  <section class="summary">
    <h2 id="daytitle"></h2>
    <p class="sub" id="priority"></p>
    <div class="filters"><button type="button" id="fAll" aria-pressed="true">전체 보기</button><button type="button" id="fNew" aria-pressed="false">새 공고만</button></div>
    <div class="tablewrap"><table class="overview" id="overview"></table></div>
    <p class="sub">행을 누르면 아래 상세 카드로 이동합니다. 칸에 마우스를 올리면 설명이 나와요.</p>
    <p class="others" id="others"></p>
  </section>

  <section class="jobs" id="jobs"></section>

  <section class="gap" id="gap" aria-label="부족한 점과 보완 방법"></section>

  <footer>공고는 잡코리아 공개 검색(로그인 없음)으로 찾았습니다. 기업 정보는 각 카드의 출처 기사 기준이며, [추정]은 제 판단입니다.</footer>
</div>

        <div class="crow"><span class="who">찬규 자차</span><span class="min">${H0.pcar}분</span><div class="cdet"><span class="sub">${esc(H0.name)} → 인천공장 · 대중교통 ${esc(H0.ptransit)}</span></div></div>
      </div></div>`;
    miniMap(document.getElementById('map'+i),j,H0,o);
    document.getElementById('links'+i).innerHTML=`<a href="${esc(j.url)}" target="_blank" rel="noopener">잡코리아 공고 보기</a><a href="${esc(naver(j,H0,'transit'))}" target="_blank" rel="noopener">네이버지도 대중교통 경로 (${esc(H0.name)} 출발)</a><a href="${esc(naver(j,H0,'car'))}" target="_blank" rel="noopener">네이버지도 자차 경로</a>${(j.sources||[]).map(s=>`<a href="${esc(s[1])}" target="_blank" rel="noopener">출처: ${esc(s[0])}</a>`).join('')}`;
  }
  const fA=document.getElementById('fAll'),fN=document.getElementById('fNew');
  fA.addEventListener('click',()=>{onlyNew=false;fA.setAttribute('aria-pressed','true');fN.setAttribute('aria-pressed','false');render()});
  fN.addEventListener('click',()=>{onlyNew=true;fN.setAttribute('aria-pressed','true');fA.setAttribute('aria-pressed','false');render()});
  render();gap();
  (()=>{const tip=document.createElement('div');tip.id='tip';tip.setAttribute('role','tooltip');document.body.appendChild(tip);let cur=null;
    const place=e=>{const pad=14,w=tip.offsetWidth,h=tip.offsetHeight;let x=e.clientX+pad,y=e.clientY+pad;if(x+w>innerWidth-8)x=e.clientX-w-pad;if(y+h>innerHeight-8)y=e.clientY-h-pad;tip.style.left=Math.max(8,x)+'px';tip.style.top=Math.max(8,y)+'px'};
    document.addEventListener('mouseover',e=>{const c=e.target.closest('[data-tip]');if(c===cur)return;cur=c;if(!c||!c.dataset.tip.trim()){tip.style.display='none';return}tip.textContent=c.dataset.tip;tip.style.display='block';place(e)});
    document.addEventListener('mousemove',e=>{if(cur)place(e)});
    document.addEventListener('scroll',()=>{tip.style.display='none';cur=null},{passive:true});})();
  document.getElementById('profile').textContent=(D.profile||'');
  document.getElementById('certs').innerHTML='<tbody>'+(D.certs||[]).map(c=>`<tr><td><span class="tag unk">${esc(c[1])}</span></td><td>${esc(c[0])}<div class="note">${esc(c[2])}</div></td></tr>`).join('')+'</tbody>';
})();
</script>
